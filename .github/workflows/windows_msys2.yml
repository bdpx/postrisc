name: windows_msys2
run-name: Windows MSYS2 build, test, deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: release
  # Customize github-pages generated files path
  DOCS_GEN_PATH: ./public
  DEPLOY_GEN_PATH: ./deploy

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v6
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        path-type: minimal
        install: >
          git
          bash
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-libbacktrace
          mingw-w64-ucrt-x86_64-boost
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-svg
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-libxslt
          mingw-w64-ucrt-x86_64-diffutils

    - name: Report runner info
      run: |
          echo 'Running in MSYS2!'
          echo 'workspace: ${{github.workspace}}'
          uname
          gcc --version
          cmake --version

    - name: Put MSYS2_MinGW64 on PATH
      # there is not yet an environment variable for this path from msys2/setup-msys2
      run: |
          echo "path: $PATH"
          echo "runner.temp: ${{runner.temp}}"
          echo "${{runner.temp}}/msys64/ucrt64/bin" >> $GITHUB_PATH

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory.
      # CMAKE_BUILD_TYPE is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: |
          echo "new path: $PATH"
          cmake -G "MinGW Makefiles" \
                -B build \
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
                -DCMAKE_CXX_COMPILER=g++ \
                -DWORKFLOW_CI_BUILD=On

    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} -- -j4

    - name: Run tests
      run: |
          ctest --test-dir build --build-config ${{env.BUILD_TYPE}}
          grep "mips" build/artifacts/result.txt

    - name: List bin dir
      run: ls -a build/bin

    #####################################################
    # Generate deploy
    #####################################################

    - name: Clean deploy directory
      run: |
          rm -rf ${{env.DEPLOY_GEN_PATH}}
          mkdir ${{env.DEPLOY_GEN_PATH}}

    - name: Copy built files
      run: |
        cmake -E copy build/bin/postrisc.exe ${{env.DEPLOY_GEN_PATH}}/postrisc.exe
        cmake -E copy build/bin/qtpostrisc.exe ${{env.DEPLOY_GEN_PATH}}/qtpostrisc.exe

    - name: List project deploy files
      run: ls -a ${{env.DEPLOY_GEN_PATH}}

    - name: Upload artifact
      # This will automatically upload an artifact from the '/public' directory
      uses: actions/upload-artifact@v6
      with:
        name: postrisc-windows-${{env.BUILD_TYPE}}-gcc-x86_64
        path: ${{env.DEPLOY_GEN_PATH}}
        retention-days: 30
